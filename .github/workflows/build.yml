name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          cp main.dart /tmp/main.dart
          flutter create --platforms=android --org com.dzwc --project-name dzwc .
          cp /tmp/main.dart lib/main.dart

      - name: Add packages
        run: flutter pub add webview_flutter webview_flutter_android permission_handler url_launcher

      - name: Patch Android manifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''.join('<uses-permission android:name="android.permission.%s"/>\n' % n for n in
                          ['INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'CAMERA'])
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('android:label="dzwc"', 'android:label="مراحيض الجزائر"')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dzwc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
